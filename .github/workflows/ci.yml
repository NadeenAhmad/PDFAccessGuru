name: CI

# GitHub Actions minutes are limited for private repositories (Windows counts twice, macOS ten
# times). So: pull requests run once (not again for the branch push), with the Linux checks only;
# merging into main also runs the second Python version, the Windows and macOS install checks and
# the type check. Everything can also be started by hand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PDFACCESSGURU_NO_UPDATE_CHECK: "1"

jobs:
  secrets:
    name: No API keys in the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search for API keys
        run: |
          if git grep -n -I -E 'sk-or-v1-[0-9a-fA-F]{20}|sk-proj-[A-Za-z0-9_-]{20}|sk-ant-[A-Za-z0-9_-]{20}|AIza[0-9A-Za-z_-]{30}|hf_[A-Za-z0-9]{30}|ghp_[A-Za-z0-9]{30}' -- . ':!*.pdf'; then
            echo "::error::An API key was found in the files above. Remove it and revoke the key."
            exit 1
          fi

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.13"]') || fromJSON('["3.12", "3.13"]') }}
    env:
      PDFACCESSGURU_TOOLS_DIR: ${{ github.workspace }}/../pdfaccessguru-tools
    defaults:
      run:
        working-directory: code/PDFAccessGuru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: code/PDFAccessGuru/pyproject.toml
      - name: Install PDFAccessGuru with test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install veraPDF with the tool's own installer
        run: pdfaccessguru doctor --install
      - name: Run tests
        # Live LLM tests are skipped without OPENROUTER_API_KEY; known failures are listed in
        # src/test/conftest.py (KNOWN_FAILURES). The full-document sets are too slow for CI.
        run: >
          python -m pytest src/test -n auto -q -rsx
          --ignore=src/test/thesis_set
          --ignore=src/test/Prof_pdf_set
          --ignore=src/test/validation_set

  install:
    name: One-line install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    env:
      PDFACCESSGURU_TOOLS_DIR: ${{ github.workspace }}/../pdfaccessguru-tools
      PDFACCESSGURU_SHORTCUT_DIR: ${{ github.workspace }}/../pdfaccessguru-shortcuts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        working-directory: code/PDFAccessGuru
        run: uv build --wheel -o ../../dist
      - name: Run the installer (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          export PDFACCESSGURU_SOURCE="$(ls "$PWD"/dist/*.whl)"
          sh code/PDFAccessGuru/installers/install.sh
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Run the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PDFACCESSGURU_SOURCE = (Get-ChildItem dist\*.whl).FullName
          ./code/PDFAccessGuru/installers/install.ps1
          (uv tool dir --bin).Trim() | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install the helper programs (Java, veraPDF)
        run: pdfaccessguru doctor --install
      - name: Check and fix a PDF with the installed tool
        shell: bash
        run: |
          cp code/PDFAccessGuru/src/test/resources/veraPDF_corpus/7.5-t01-fail-a.pdf table.pdf
          pdfaccessguru check table.pdf || test $? -eq 1
          pdfaccessguru fix table.pdf
          test -f table_accessible.pdf && test -f table_accessible_report.md
      - name: Use the browser app (start, upload, fix, download, close)
        shell: bash
        run: uv run --no-project python code/PDFAccessGuru/installers/check_app.py table.pdf
      - name: Shortcut exists
        shell: bash
        run: ls -R "$PDFACCESSGURU_SHORTCUT_DIR"

  typecheck:
    name: Type check (informational)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/PDFAccessGuru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/PDFAccessGuru/pyproject.toml
      - name: Install PDFAccessGuru with dev tools (includes pyright)
        run: pip install -e ".[dev]"
      - name: Run pyright on src/pdfaccessguru
        # Informational until the existing type errors are fixed (73 on 2026-11-06):
        # reports the count as a warning instead of failing the check.
        run: |
          if ! pyright src/pdfaccessguru > pyright.txt; then
            echo "::warning::pyright: $(tail -1 pyright.txt)"
          fi
          tail -1 pyright.txt
